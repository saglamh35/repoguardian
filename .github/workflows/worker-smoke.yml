name: Worker Smoke
on:
  pull_request:
    branches: [ main ]
    paths: [ "worker/**", ".github/workflows/**", "gitleaks.json" ]
  push:
    branches: [ stage-6-worker-health-1 ]

jobs:
  worker_smoke:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      # ÖNEMLİ: cache kullanmıyoruz; sadece Node 20 kuruyoruz
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install curl & jq
        run: sudo apt-get update && sudo apt-get install -y curl jq

      - name: Install worker deps
        run: pnpm -C worker install

      - name: Start worker
        run: pnpm -C worker dev &
        env:
          REDIS_URL: redis://localhost:6379
          WORKER_PORT: 4000

      - name: Wait for health
        run: |
          for i in {1..30}; do
            curl -fsS http://localhost:4000/health && exit 0
            sleep 2
          done
          exit 1

      - name: Enqueue secret & osv
        id: enqueue
        run: |
          SECRET=$(curl -fsS -X POST http://localhost:4000/enqueue/scan/secret -H 'content-type: application/json' -d '{"repoPath":"."}' | jq -r .id)
          OSV=$(curl -fsS -X POST http://localhost:4000/enqueue/scan/osv -H 'content-type: application/json' -d '{"packages":[{"package":{"ecosystem":"npm","name":"next"},"version":"14.2.10"}]}' | jq -r .id)
          echo "secret_id=$SECRET" >> $GITHUB_OUTPUT
          echo "osv_id=$OSV" >> $GITHUB_OUTPUT

      - name: Wait jobs completion
        run: |
          for ID in "${{ steps.enqueue.outputs.secret_id }}" "${{ steps.enqueue.outputs.osv_id }}"; do
            echo "waiting $ID"
            for i in {1..60}; do
              STATE=$(curl -fsS http://localhost:4000/job/$ID | jq -r .state)
              echo "state=$STATE"
              [ "$STATE" = "completed" ] && break
              sleep 1
            done
          done

      - name: Check metrics
        run: |
          curl -fsS http://localhost:4000/metrics | grep -E "repoguardian_scan_total|repoguardian_scan_duration_seconds|repoguardian_queue_depth"
